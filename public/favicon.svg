  <!-- Central Lock/Package Core -->
  <rect x="25" y="27" width="14" height="12" rx="2.5" fill="url(#coreGrad)" filter="url(#glow)"/>
  <path d="M28 27V23C28 20.8 29.8 19 32 19C34.2 19 36 20.8 36 23V27" stroke="url(#coreGrad)" stroke-width="2.5" stroke-linecap="round"/>
